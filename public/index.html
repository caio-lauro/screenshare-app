<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compartilhar Tela</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  #status { color: #999; font-size: 0.9rem; margin-bottom: 20px; }
  .choice { display: flex; gap: 16px; margin-top: 20px; }
  #mainLayout {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: 20px;
    width: 100%;
    max-width: 1450px;
  }
  #stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 1 auto;
    min-width: 0;
  }
  @media (max-width: 900px) {
    #mainLayout { flex-direction: column; align-items: center; }
    #chatPanel { flex: 0 0 auto; width: 100%; max-width: 500px; }
  }
  button {
    background: #2d6cdf;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #4a80e6; }
  button:disabled { background: #444; cursor: default; }
  video {
    width: 100%;
    max-width: 1100px;
    background: #000;
    border-radius: 8px;
    margin-top: 20px;
  }
  #volumeRow {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    color: #ccc;
    font-size: 0.9rem;
  }
  #volumeSlider { width: 200px; }
  #fullscreenBtn { display: none; margin-top: 4px; padding: 8px 16px; font-size: 0.85rem; }
  #stopBtn { background: #d9433f; margin-top: 16px; }
  #stopBtn:hover { background: #e8615d; }
  #hostFallback {
    font-size: 0.8rem;
    margin-top: -10px;
    margin-bottom: 10px;
  }
  #hostFallback a { color: #666; text-decoration: underline; cursor: pointer; }
  #hostFallback a:hover { color: #999; }
  #chatPanel {
    display: none;
    flex-direction: column;
    width: 400px;
    flex: 0 0 400px;
    margin-top: 20px;
    background: #1a1a1a;
    border-radius: 8px;
    overflow: hidden;
    align-self: flex-start;
  }
  #chatLog {
    height: 480px;
    overflow-y: auto;
    padding: 10px 14px;
    font-size: 0.88rem;
    line-height: 1.5;
  }
  #chatLog .msg { margin-bottom: 4px; word-wrap: break-word; }
  #chatLog .msg b { color: #7fd0ff; }
  #chatInputRow {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid #2a2a2a;
  }
  #chatName {
    width: 90px;
    background: #222;
    border: 1px solid #333;
    color: #eee;
    border-radius: 6px;
    padding: 8px;
    font-size: 0.85rem;
  }
  #chatText {
    flex: 1;
    background: #222;
    border: 1px solid #333;
    color: #eee;
    border-radius: 6px;
    padding: 8px;
    font-size: 0.85rem;
  }
  #chatSendBtn { padding: 8px 14px; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>🖥️ Compartilhamento de Tela</h1>
  <div id="status">Escolha uma opção abaixo</div>

  <div class="choice" id="choiceButtons" style="display:none">
    <button id="hostBtn">Hospedar minha tela</button>
    <button id="viewBtn">Entrar em uma sala</button>
  </div>
  <div id="hostFallback">
    <a href="#" id="hostFallbackLink">Prefere hospedar pelo navegador em vez do app?</a>
  </div>

  <div id="mainLayout">
    <div id="stage">
      <video id="video" autoplay playsinline style="display:none"></video>
      <div id="volumeRow">
        🔊 Volume: <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
      </div>
      <button id="fullscreenBtn">⛶ Tela cheia</button>
      <button id="stopBtn" style="display:none">Encerrar</button>
    </div>

    <div id="chatPanel">
      <div id="chatLog"></div>
      <div id="chatInputRow">
        <input id="chatName" placeholder="Seu nome" maxlength="24">
        <input id="chatText" placeholder="Mensagem..." maxlength="300">
        <button id="chatSendBtn">Enviar</button>
      </div>
    </div>
  </div>

  <a 
    href="https://github.com/caio-lauro/screenshare-app/releases/download/mk0.3.1/ScreenShare_0.3.1_x64-setup.exe"
    style="
      color: #666;
      text-decoration: none;
      position: fixed;
      right: 10px;
      bottom: 10px;
    "
  >Download do aplicativo</a>
  <script src="client.js"></script>
</body>
</html>
